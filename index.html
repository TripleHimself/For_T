<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#120b1b">
  <title>Three Songs For You</title>

  <style>
    :root {
      --bg: #120b1b;
      --text: #fff9fc;
      --muted: rgba(255, 255, 255, 0.64);
      --border: rgba(255, 255, 255, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(
          circle at 18% 10%,
          rgba(236, 72, 153, 0.22),
          transparent 34%
        ),
        radial-gradient(
          circle at 82% 35%,
          rgba(139, 92, 246, 0.2),
          transparent 38%
        ),
        radial-gradient(
          circle at 50% 95%,
          rgba(244, 114, 182, 0.13),
          transparent 35%
        ),
        var(--bg);
    }

    button {
      font: inherit;
    }

    /* Permanent heart layers */

    .background-hearts,
    .burst-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .background-hearts {
      z-index: 0;
    }

    .burst-layer {
      z-index: 20;
    }

    .floating-heart {
      position: absolute;
      bottom: -40px;
      color: rgba(249, 168, 212, 0.2);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translate3d(0, 0, 0) rotate(0);
        opacity: 0;
      }

      12% {
        opacity: 0.7;
      }

      100% {
        transform:
          translate3d(var(--drift), -115vh, 0)
          rotate(35deg);
        opacity: 0;
      }
    }

    /* Main page */

    .page {
      position: relative;
      z-index: 1;
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 72px 0 48px;
    }

    header {
      margin-bottom: 48px;
      text-align: center;
      animation: arrive 0.8s ease both;
    }

    @keyframes arrive {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .letter-icon {
      display: grid;
      width: 82px;
      height: 82px;
      margin: 0 auto 22px;
      place-items: center;
      border: 1px solid rgba(251, 207, 232, 0.2);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 24px 60px rgba(236, 72, 153, 0.2);
      font-size: 38px;
      animation: breathe 3.5s ease-in-out infinite;
      backdrop-filter: blur(18px);
    }

    @keyframes breathe {
      0%,
      100% {
        transform: rotate(-3deg) scale(1);
      }

      50% {
        transform: rotate(3deg) scale(1.06);
      }
    }

    .kicker {
      margin: 0 0 12px;
      color: rgba(251, 207, 232, 0.68);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      background: linear-gradient(
        90deg,
        #ffffff,
        #fce7f3,
        #ddd6fe
      );
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      font-size: clamp(2.5rem, 7vw, 4.1rem);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    .intro-copy {
      max-width: 590px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    .instruction {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 26px;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      backdrop-filter: blur(10px);
    }

    .instruction span {
      color: #f9a8d4;
    }

    /* Chapters */

    .chapters {
      display: grid;
      gap: 20px;
    }

    .chapter {
      position: relative;
      scroll-margin: 32px;
      overflow: hidden;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.065);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
      transition:
        opacity 0.55s ease,
        transform 0.55s ease,
        background 0.4s ease,
        box-shadow 0.4s ease;
      backdrop-filter: blur(20px);
    }

    .chapter.locked {
      opacity: 0.34;
    }

    .chapter.just-unlocked {
      animation: unlockPulse 0.9s ease;
    }

    @keyframes unlockPulse {
      0% {
        transform: scale(0.97);
        filter: brightness(1);
      }

      45% {
        transform: scale(1.018);
        filter: brightness(1.35);
      }

      100% {
        transform: scale(1);
        filter: brightness(1);
      }
    }

    .chapter::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 4px;
      background: var(--gradient);
    }

    .chapter-number {
      position: absolute;
      top: -28px;
      right: -12px;
      color: rgba(255, 255, 255, 0.035);
      font-size: 128px;
      font-weight: 900;
      line-height: 1;
      user-select: none;
    }

    .chapter-header {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .chapter-icon {
      display: grid;
      flex: 0 0 56px;
      width: 56px;
      height: 56px;
      place-items: center;
      border-radius: 18px;
      background: var(--gradient);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
      font-size: 25px;
    }

    .eyebrow {
      margin: 2px 0 6px;
      color: rgba(251, 207, 232, 0.68);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.25rem, 4vw, 1.55rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .closed-content,
    .revealed-content {
      position: relative;
      margin-top: 24px;
    }

    .reveal-button {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 16px 20px;
      border: 0;
      border-radius: 17px;
      background: var(--gradient);
      box-shadow: 0 14px
